<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بی‌هوش | دستیار توسعه بازی</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div class="chat-container">
        <header>
            <div class="header-top">
                <h1>بی‌هوش 🎮</h1>
                <button class="settings-btn" onclick="toggleSettings()">⚙️ تنظیمات</button>
            </div>
            <p>دستیار هوشمند توسعه بازی</p>
            
            <!-- بخش تنظیمات (به صورت پیش‌فرض مخفی است) -->
            <div id="settings-panel" class="settings-panel hidden">
                <label>انتخاب سرویس‌دهنده:</label>
                <select id="provider" onchange="onProviderChange()">
                    <option value="openrouter">OpenRouter</option>
                    <option value="groq">Groq</option>
                </select>

                <label>کلید API (در حافظه ذخیره می‌شود):</label>
                <input type="password" id="api-key-input" placeholder="sk-..." onchange="saveApiKey()">

                <label>انتخاب مدل (مدل‌های موجود):</label>
                <select id="model-select">
                    <option value="">ابتدا کلید API را وارد کنید...</option>
                </select>
            </div>
        </header>
        
        <div id="chat-box" class="chat-box">
            <div class="message bot">سلام! من بی‌هوش هستم. برای شروع، روی دکمه ⚙️ تنظیمات بزن، سرویس‌دهنده و کلید API خودت رو وارد کن تا مدل‌ها لود بشن!</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="سوال خود را بنویسید یا میکروفون را بزنید...">
            <button class="send-btn" onclick="sendMessage()">ارسال</button>
            <button id="mic-btn" class="mic-btn" onclick="startVoiceRecognition()">🎤</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
                           </html>
